name: Monthly refresh

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campaign-window:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.window.outputs.publish }}
    steps:
      - id: window
        name: Check prepared campaign window
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          day = datetime.now(timezone.utc).date().isoformat()
          blocked = os.environ["GITHUB_EVENT_NAME"] == "schedule" and "2026-10-12" <= day < "2026-11-12"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("publish=" + str(not blocked).lower() + "\n")
          if blocked:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("The prepared November catalog release owns this scheduled slot. Normal monthly publishing resumes after 12 November 2026. Manual dispatch remains available.\n")
          PY

  refresh:
    needs: campaign-window
    if: needs.campaign-window.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Validate npm packages
        run: python validate_npm.py servers-final.validated.json

      - name: Introspect MCP servers
        env:
          CONCURRENCY: "8"
          TIMEOUT: "120"
          SERVERS_FILE: "servers-final.validated.json"
        run: python introspect.py

      - name: Diff vs previous snapshot
        run: |
          mkdir -p changelogs
          DATE=$(date -u +%Y-%m-%d)
          if [ -f snapshots/tools-prev.jsonl ]; then
            python diff_snapshot.py snapshots/tools-prev.jsonl data/tools.jsonl > "changelogs/changelog-$DATE.md" || true
          else
            echo "(first run, no previous snapshot)" > "changelogs/changelog-$DATE.md"
          fi

      - name: Package HF dataset
        run: python package_dataset.py

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf-dataset",
              repo_id="automatelab/mcp-servers-tool-catalog",
              repo_type="dataset",
              commit_message="Monthly refresh",
          )
          PY

      - name: Commit rolling state + changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/servers.jsonl data/tools.jsonl changelogs/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: monthly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
